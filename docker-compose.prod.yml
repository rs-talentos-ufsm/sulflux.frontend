services:
  frontend:
    container_name: '${PROJECT_NAME}_frontend_prod'
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s